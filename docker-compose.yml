version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pulsepoint-ai:latest
    container_name: pulsepoint_ai_app
    ports:
      - "8501:8501"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3